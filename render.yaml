# Render Blueprint. Uses the existing Postgres instance "lobbystudio" (Frankfurt).
# A single free web service also runs the outcome sweep (RUN_SWEEPER=1). To move the sweep to a
# dedicated worker later, add a `type: worker` service with `dockerCommand: sh scripts/start-worker.sh`
# and drop RUN_SWEEPER here.
services:
  - type: web
    name: lobbystudio
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_SWEEPER
        value: "1"
      - key: PII_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lobbystudio
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CONSOLE_PASSWORD
        sync: false
