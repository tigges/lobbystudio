# Render Blueprint. Uses the existing Postgres instance "lobbystudio" (Frankfurt).
envVarGroups:
  - name: lobbystudio-shared
    envVars:
      - key: PII_KEY
        generateValue: true
      - key: NODE_ENV
        value: production

services:
  - type: web
    name: lobbystudio
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - fromGroup: lobbystudio-shared
      - key: DATABASE_URL
        fromDatabase:
          name: lobbystudio
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CONSOLE_PASSWORD
        sync: false

  - type: worker
    name: lobbystudio-worker
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: sh scripts/start-worker.sh
    autoDeploy: true
    envVars:
      - fromGroup: lobbystudio-shared
      - key: DATABASE_URL
        fromDatabase:
          name: lobbystudio
          property: connectionString
