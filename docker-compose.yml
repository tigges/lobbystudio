services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
      POSTGRES_DB: dental_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_bot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
